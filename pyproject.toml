[project]
name = "memo-extract"
version = "0.1.0"
description = "Tiny on-device model that turns personal memos into saved details and follow-up suggestions"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.10",
    "transformers>=5.2",
    "onnx>=1.19",
    "onnxruntime>=1.23",
    "onnxscript>=0.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint.per-file-ignores]
# the name lists read better as one string per line than as a 400-line list literal
"memo_extract/names.py" = ["SIM905"]
